apiVersion: v1
kind: Namespace
metadata:
  name: vibe-hub

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-site-config
  namespace: vibe-hub
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html/content;
      index index.html;

      location / {
        try_files $uri $uri/ =404;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-hub-deployment
  namespace: vibe-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-hub
  template:
    metadata:
      name: vibe-hub-pod
      labels:
        app: vibe-hub
    spec:
      hostAliases:
        - ip: 140.82.114.36
          hostnames:
            - ssh.github.com
      containers:
        - name: nginx-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: volume-html-content
              mountPath: /usr/share/nginx/html
            - name: nginx-site-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
        - name: git-sync-sidecar
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          args:
            - --repo=ssh://git@ssh.github.com:443/LegoCoyMan-Alpha/coy-vibe54-test.git
            - --ref=main
            - --root=/tmp/git
            - --link=content
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts=true
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
            - --git-config=core.sshCommand:ssh -i /etc/git-secret/ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/git-secret/known_hosts -o Hostname=ssh.github.com -o Port=443
            - --max-failures=-1
            - --period=10s
            - --one-time=false
          volumeMounts:
            - name: volume-html-content
              mountPath: /tmp/git
            - name: git-ssh-key
              mountPath: /etc/git-secret
              readOnly: true
      volumes:
        - name: volume-html-content
          emptyDir: {}
        - name: nginx-site-config
          configMap:
            name: nginx-site-config
        - name: git-ssh-key
          secret:
            secretName: git-ssh-key
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibe-hub-deployment
  namespace: vibe-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibe-hub
  template:
    metadata:
      name: vibe-hub-pod
      labels:
        app: vibe-hub
    spec:
      containers:
        - name: nginx-container
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: volume-html-content
              mountPath: /usr/share/nginx/html
        - name: git-sync-sidecar
          image: registry.k8s.io/git-sync/git-sync:v4.2.3
          args:
            - --repo=https://github.com/LegoCoyMan-Alpha/coy-vibe54-test.git
            - --ref=main
            - --root=/tmp/git
            - --link=content
            - --period=30s
            - --one-time=false
          volumeMounts:
            - name: volume-html-content
              mountPath: /tmp/git
      volumes:
        - name: volume-html-content
          emptyDir: {}
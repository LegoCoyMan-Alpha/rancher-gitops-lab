apiVersion: v1
kind: ConfigMap
metadata:
  name: html-content
  labels:
    app: nginx
    website: Coy
data:
  index.html: |
    <html>
      <head>
        <title>Coy's Web Hosting</title>
        <link rel="stylesheet" href="style.css">
      </head>
      <body>
        <h1>Welcome to Coy's Web Hosting!</h1>
        <p>Coy is the Alpha Male all the time</p>
      </body>
    </html>
  
  style.css: |
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #333333;
    }
    p {
      color: #666666;
    }

    my_name: "coy like the phish"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-cluster-secrets-eso
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/LegoCoyMan-Alpha/rancher-gitops-lab.git
    targetRevision: main
    path: Apps/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
